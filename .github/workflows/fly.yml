name: Fly Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    name: Deploy app
    needs: check
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # pinned full commit SHA
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
